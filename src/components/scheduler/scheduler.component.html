<div class="content-wrapper grid-to-schedule">
      <div class="button-container">
        <button class="load-appointments-btn" (click)="loadAppointments()" [disabled]="appointmentsLoaded">
          {{ appointmentsLoaded ? 'Appointments Loaded (1000)' : 'Load 1000 Appointments' }}
        </button>
      </div>
      <span class="load-time-info">
        Load Time: <strong>{{ loadTime }}ms</strong> | Appointments: <strong>{{ appointmentsLoaded ? '1000' : '0' }}</strong> | Resources: <strong>5</strong>
      </span>
      <div class="schedule-container">
        <div class="schedule-content">
          <ejs-schedule #scheduleObj id="Schedule" width="100%" height="100%" allowDragAndDrop="true" rowAutoHeight="true" cssClass="grid-schedule"
            [selectedDate]="selectedDate" [group]="group" (dataBound)="onDataBound()" [eventSettings]="eventSettings"
            [eventDragArea]="'.content-wrapper'" (dragStop)="handleDragStop($event)">
            <e-resources>
              <e-resource field="TaskId" title="Employee" [dataSource]="employeesData" name="Employees" textField="text" idField="id" colorField="color">
              </e-resource>
            </e-resources>
            <e-views>
              <e-view option="TimelineDay"></e-view>
              <e-view option="TimelineMonth"></e-view>
            </e-views>
          </ejs-schedule>
        </div>
        <div class="grid-content">
          <ejs-grid
            id="Grid" #gridObj [dataSource]="gridData" width="450px" height="100%" cssClass="drag-grid" [allowSelection]="true" [allowRowDragAndDrop]="true"
            [editSettings]="editSettings" [rowDropSettings]="rowDropSettings" (rowDrop)="onRowDrop($event)" (rowDrag)="onRowDrag($event)"
          >
            <e-columns>
              <e-column field="Task" headerText="Task" width="50"></e-column>
              <e-column field="Duration" headerText="Duration" width="30"></e-column>
            </e-columns>
          </ejs-grid>
        </div>
      </div>
    </div>
